name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: graffiti
          POSTGRES_PASSWORD: graffiti-test
          POSTGRES_DB: graffiti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graffiti -d graffiti_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://graffiti:graffiti-test@127.0.0.1:5432/graffiti_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hardhat tests
        run: npx hardhat test
        working-directory: contracts

      - name: Workspace tests
        run: npm test --workspaces --if-present

      - name: Type-check workspaces
        run: |
          for ws in contracts backend shared web-kiosk web-gallery web-verify web-admin; do
            if [ -f "$ws/tsconfig.json" ]; then
              echo "Type-checking $ws..."
              npx tsc --noEmit -p "$ws/tsconfig.json"
            fi
          done
