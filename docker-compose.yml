services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      # Override with compose-internal service hostnames; no secrets here.
      RPC_URL: http://hardhat:8545
      KUBO_API: http://kubo:5001
      DATABASE_URL: postgresql://graffiti:graffiti-local@postgres:5432/graffiti
    depends_on:
      hardhat:
        condition: service_healthy
      kubo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  hardhat:
    image: node:22.11.0-alpine3.20
    working_dir: /app
    volumes:
      - ./contracts:/app
      - hardhat-node-modules:/app/node_modules
    # deploy contract after node is ready:
    #   docker compose exec hardhat npx hardhat run scripts/deploy.ts --network localhost
    command: sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"
    healthcheck:
      # Plain GET returns HTTP 400; send a real JSON-RPC call instead.
      test: ["CMD-SHELL", "wget -qO- --post-data='{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"id\":1}' --header='Content-Type: application/json' http://127.0.0.1:8545"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  kubo:
    image: ipfs/kubo:v0.29.0
    ports:
      - "5001:5001"
      - "8080:8080"
      - "4001:4001"
    volumes:
      - kubo-data:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --post-data='' http://localhost:5001/api/v0/id"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graffiti
      POSTGRES_PASSWORD: graffiti-local
      POSTGRES_DB: graffiti
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graffiti -d graffiti"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graffiti
      POSTGRES_PASSWORD: graffiti-test
      POSTGRES_DB: graffiti_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graffiti -d graffiti_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kubo-data:
  postgres-data:
  hardhat-node-modules:
