services:
  - type: web
    name: nft-graffiti-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./infra/docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3001"
      - key: CHAIN_NETWORK
        value: polygon-amoy
      - key: RPC_URL
        value: https://rpc-amoy.polygon.technology/
      - key: CONTRACT_ADDRESS
        sync: false
      - key: MINTER_PRIVATE_KEY
        sync: false
      - key: IPFS_PROVIDER
        value: pinata
      - key: PINATA_JWT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: MODERATION_MODE
        value: display_after_approve
      - key: KILL_SWITCH
        value: "false"
